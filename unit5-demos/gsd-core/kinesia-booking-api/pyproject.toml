[project]
name = "kinesia"
version = "0.1.0"
description = "Kinesia: appointment booking API (GSD Core example)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx`"]
